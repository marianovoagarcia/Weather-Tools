name: Run Upper-Air Trend Dashboard

on:
  workflow_dispatch:
    inputs:
      station_icao:
        description: 'Station ICAO (e.g., TJSJ)'
        required: false
        default: 'TJSJ'
      station_wmo:
        description: 'Station WMO ID (e.g., 78526)'
        required: false
        default: '78526'
      use_latest:
        description: 'Use latest synoptic sounding (True/False)'
        required: false
        default: 'True'
      sounding_date:
        description: 'Sounding Date (YYYY-MM-DD)'
        required: false
        default: ''
      sounding_hour:
        description: 'Sounding Hour (00Z or 12Z)'
        required: false
        default: '12Z'
      dates_back:
        description: 'Days back to plot'
        required: false
        default: '2'

permissions:
  contents: write

jobs:
  run-upper-air-trends:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib requests siphon metpy

      - name: Run Upper-Air Trends Script
        env:
          STATION_ICAO: ${{ github.event.inputs.station_icao || 'TJSJ' }}
          STATION_WMO: ${{ github.event.inputs.station_wmo || '78526' }}
          USE_LATEST: ${{ github.event.inputs.use_latest || 'True' }}
          SOUNDING_DATE: ${{ github.event.inputs.sounding_date || '' }}
          SOUNDING_HOUR: ${{ github.event.inputs.sounding_hour || '12Z' }}
          DATES_BACK: ${{ github.event.inputs.dates_back || '2' }}
        run: python run_upper_air_trends.py

      - name: Commit and Push Upper-Air Trends Graphic
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web_images/upper_air_trends.png
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update upper-air trends graphic [skip ci]"
            git pull --rebase origin main
            git push
          fi
