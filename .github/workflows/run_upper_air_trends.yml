name: Run Upper-Air Trend Dashboard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-upper-air-trends:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib requests siphon metpy

      - name: Run Upper-Air Trends Script
        run: python run_upper_trends.py

      - name: Commit and Push Upper-Air Trends Graphic
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web_images/upper_air_trends.png
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update upper-air trends graphic [skip ci]"
            git pull --rebase origin main
            git push
          fi
