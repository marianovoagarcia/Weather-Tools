name: Climo vs Models

on:
  repository_dispatch:
    types: [run_climo_job]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-climo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Climo vs Models Script
        env:
          STATION: ${{ github.event.client_payload.station || '78526' }}
        # Change this filename if your script has a different name
        run: python run_climo_vs_models.py

      - name: Commit and Push Climo Graphic
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web_images/climo_vs_models.png
          git commit -m "Auto-update climo graphic [skip ci]" || exit 0
          git push
