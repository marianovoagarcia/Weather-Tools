name: Run Climo vs Models

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-climo-models]

permissions:
  contents: write

jobs:
  run-climo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib requests scipy xarray cfgrib eccodes metpy

      - name: Run Climo vs Models Script
        run: python run_climo_vs_models.py

      - name: Commit and Push Climo Graphic
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web_images/climo_vs_models.png
          git diff --staged --quiet || git commit -m "Auto-update climo graphic [skip ci]"
          git push
