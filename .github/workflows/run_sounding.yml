name: Generate Risk Assessment

on:
  repository_dispatch:
    types: [run_sounding_job]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-assessment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        env:
          STATION: ${{ github.event.client_payload.station || '78526' }}
          SOUNDING_DATE: ${{ github.event.client_payload.date || '2026-11-10' }}
          SOUNDING_HOUR: ${{ github.event.client_payload.hour || '12Z' }}
        run: python run_risk_assessment.py

      - name: Commit and Push Image
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web_images/risk_latest.png
          git commit -m "Auto-update latest sounding risk graphic [skip ci]" || exit 0
          git push
