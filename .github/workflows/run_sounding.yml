name: Generate Risk Assessment

on:
  repository_dispatch:
    types: [run_sounding_job]
  workflow_dispatch:

jobs:
  run-assessment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        env:
          STATION: ${{ github.event.client_payload.station || '78526' }}
          SOUNDING_DATE: ${{ github.event.client_payload.date || '2026-11-10' }}
          SOUNDING_HOUR: ${{ github.event.client_payload.hour || '12Z' }}
        run: python run_risk_assessment.py

      - name: Save Output Graphic as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: risk-latest-graphic
          path: web_images/risk_latest.png
